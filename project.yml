name: RoadPulse
options:
  bundleIdPrefix: com.persuasivepost
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  RoadPulse:
    type: application
    platform: iOS
    sources:
      - path: RoadPulse
        excludes:
          - "**/.gitkeep"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.persuasivepost.roadpulse
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
    # Generated into the source folder by XcodeGen; git-ignored.
    info:
      path: RoadPulse/Info.plist
      properties:
        CFBundleDisplayName: RoadPulse
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: RoadPulse uses the camera to photograph road hazards so they can be classified on your device.
        NSPhotoLibraryUsageDescription: RoadPulse reads photos you choose so road hazards in them can be classified on your device.
        NSLocationWhenInUseUsageDescription: RoadPulse uses your location to geotag hazards and show nearby ones on the map.
        NSMotionUsageDescription: RoadPulse uses the motion sensors in Drive Mode to detect rough road surfaces.

  RoadPulseTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RoadPulseTests
    dependencies:
      - target: RoadPulse
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.persuasivepost.roadpulse.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  RoadPulse:
    build:
      targets:
        RoadPulse: all
        RoadPulseTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - RoadPulseTests
