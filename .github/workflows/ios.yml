name: iOS

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Pick an iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          runtimes = sorted(k for k in data if ".iOS-" in k)
          for rt in reversed(runtimes):
              phones = [d for d in data[rt] if d["name"].startswith("iPhone") and d["isAvailable"]]
              if phones:
                  print(phones[-1]["udid"])
                  break
          ')
          if [ -z "$UDID" ]; then echo "No iPhone simulator found"; exit 1; fi
          echo "Using simulator $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          xcodebuild build \
            -project RoadPulse.xcodeproj \
            -scheme RoadPulse \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO

      - name: Test
        run: |
          rm -rf build/RoadPulse.xcresult
          xcodebuild test \
            -project RoadPulse.xcodeproj \
            -scheme RoadPulse \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath build/RoadPulse.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: RoadPulse.xcresult
          path: build/RoadPulse.xcresult
